name: model-monitoring

on:
  workflow_dispatch:
    inputs:
      log_to_mlflow:
        description: "Залогировать отчёт в MLflow (эксперимент model-monitoring)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 1 * *"        # 1-го числа каждого месяца, 06:00 UTC
  push:                        # пересобрать дашборд при изменении кода
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/monitoring.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ "${{ inputs.log_to_mlflow }}" = "true" ]; then
            python src/monitoring.py --log-to-mlflow
          else
            python src/monitoring.py
          fi

      - name: Link-preview image (og:image for LinkedIn and messengers)
        continue-on-error: true      # без картинки дашборд всё равно публикуется
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python src/preview.py docs

      - name: Save metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: docs/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deploy
        uses: actions/deploy-pages@v4
